server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to mock-api if needed or let them go to the VITE_API_URL
    # In docker-compose, the frontend will use the container name
}
