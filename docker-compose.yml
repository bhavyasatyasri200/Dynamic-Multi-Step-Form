version: '3.8'

services:
  frontend:
    build: .
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:3001
    depends_on:
      - mock-api
    networks:
      - app-network

  mock-api:
    image: Clue/json-server
    ports:
      - "3001:80"
    volumes:
      - ./db.json:/data/db.json
      - ./routes.json:/data/routes.json
    command: --watch db.json --routes routes.json --port 80
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
